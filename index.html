<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Davo Ratings">
<meta name="theme-color" content="#0b3d2e">
<title>Davo Ratings</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#14201b;--mute:#66736d;--line:#dbe2de;--brand:#0b3d2e;--brand2:#14664c;--good:#0a7d3b;--bad:#c0262d;--bet:#e6f6ec;--warn:#fff4d6;--chip:#e3eae6}
@media (prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#17211c;--ink:#e8efeb;--mute:#93a39a;--line:#2a3830;--brand:#0b3d2e;--brand2:#1c8a65;--good:#4fd68a;--bad:#ff7b80;--bet:#12301f;--warn:#3a3114;--chip:#22302a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:env(safe-area-inset-top,0px) 0 0}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 2px}
.hd b{font-size:17px}.hd span{font-size:13px;opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 10px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:42px;height:38px;border:0;border-radius:19px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;padding:0 13px}
nav button.on{background:#fff;color:var(--brand)}
nav button.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7be3a7;margin-left:5px;vertical-align:middle}
nav button.fin::after{background:#ffd166}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.big{text-align:center;padding:18px 10px}
.big .v{font-size:40px;font-weight:700;letter-spacing:-.02em}
.big .l{font-size:13px;color:var(--mute)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.st .v{font-size:18px;font-weight:650}.st .l{font-size:11px;color:var(--mute);text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mute);text-transform:uppercase;text-align:right;padding:4px 4px;font-weight:600}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr.go{cursor:pointer}
.tag{font-size:10px;padding:2px 6px;border-radius:8px;background:var(--chip);color:var(--mute);font-weight:700}
.tag.f{background:#ffe9a8;color:#6b5200}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:8px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--brand2);color:#fff;border-radius:11px;padding:11px 14px;font-weight:650;font-size:15px}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.red{background:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:9px;border-radius:9px;font-weight:700;font-size:14px}
.seg button.on{background:var(--brand2);color:#fff}
.rn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.rn.hasbet{background:var(--bet);border-color:var(--good)}
.rn.scr{opacity:.55}
.rn .top{display:flex;align-items:center;gap:8px}
.rn .tab{width:30px;text-align:center;font-weight:800;font-size:16px;color:var(--mute);flex:0 0 30px;padding:4px 0;border:0;background:transparent}
.rn .nm{flex:1;font-weight:650;border:0;background:transparent;padding:4px 2px;font-size:15px;text-transform:uppercase;min-width:0}
.rn .pr{font-weight:800;font-size:19px;min-width:62px;text-align:right}
.rn .pr small{display:block;font-size:10px;color:var(--mute);font-weight:600}
.rn .x{border:0;background:transparent;color:var(--mute);font-size:20px;padding:0 4px}
.ins{display:grid;grid-template-columns:1fr 1fr 74px;gap:8px;margin-top:6px;align-items:end}
.ins label{font-size:10px;color:var(--mute);text-transform:uppercase}
.ins input{padding:8px;font-size:17px;font-weight:600}
.won{height:41px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:800;color:var(--mute)}
.won.on{background:var(--good);color:#fff;border-color:var(--good)}
.bet{font-size:13px;margin-top:6px;font-weight:600}
.tot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:15;font-variant-numeric:tabular-nums}
.tot div{text-align:center}.tot .l{font-size:10px;color:var(--mute);text-transform:uppercase}.tot .v{font-weight:750;font-size:16px}
.note{font-size:12px;color:var(--mute)}
.warn{background:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.log{font-size:13px;white-space:pre-wrap;margin-top:8px}
.bl{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bl:first-of-type{border-top:0}
.bl .s{font-weight:750}
.hide{display:none}
</style>
</head>

/* ============ maths (same model as the Excel macro) ============ */
function erfSmall(x){ var s=0,t=x,n=0; for(n=0;n<80;n++){ s+=t/(2*n+1); t=-t*x*x/(n+1); if(Math.abs(t)<1e-18) break; } return 2/Math.sqrt(Math.PI)*s; }
function erfc(x){ // x>=0
  if(x<3) return 1-erfSmall(x);
  var f=0; for(var k=60;k>=1;k--) f=(k/2)/(x+f);
  return Math.exp(-x*x)/Math.sqrt(Math.PI)/(x+f);
}
function Phi(z){ return z>=0 ? 1-0.5*erfc(z/Math.SQRT2) : 0.5*erfc(-z/Math.SQRT2); }
var SLICE=[]; (function(){ for(var i=0;i<17;i++){ var c=-4+0.5*i; SLICE.push([c,Phi(c+0.25)-Phi(c-0.25)]); } })();

function ratingVal(r){ var t=String(r.rating==null?'':r.rating).trim(); if(t===''||/^s/i.test(t)) return 0; var v=parseFloat(t); return isFinite(v)&&v>0?v:0; }
function isScr(r){ return /^s/i.test(String(r.rating||'').trim()); }
function num(x){ var v=parseFloat(String(x==null?'':x).trim()); return isFinite(v)?v:NaN; }
function round(x,d){ var m=Math.pow(10,d); return Math.round((x+1e-12)*m)/m; }
function unit(){ return round(S.settings.account/S.settings.div,2); }

function calc(race){
  var n=race.runners.length, sd=S.settings.sd, mk=S.settings.market/100, T=unit();
  var m=[]; for(var i=0;i<MAXRUN;i++) m.push(i<n?ratingVal(race.runners[i]):0);
  var P=[]; for(var t=0;t<MAXRUN;t++){
    var tot=0;
    for(var k=0;k<SLICE.length;k++){
      var c=SLICE[k][0], w=SLICE[k][1], prod=1, self=1;
      for(var a=0;a<MAXRUN;a++){ var p=Phi((c*sd+m[t]-m[a])/sd); if(a===t) self=p; prod*=p; }
      tot+=w*prod/self;
    }
    P.push(tot);
  }
  var sum=0; for(var j=0;j<MAXRUN;j++) sum+=P[j];
  var out=[], outlay=0, ret=0, nb=0;
  for(var q=0;q<n;q++){
    var r=race.runners[q], o={p:P[q]/sum,price:null,stake:0,ret:0,qual:false};
    if(m[q]>0){ o.price = P[q]<0.002 ? 1000 : round(sum/(mk*P[q]),1); }
    if(o.price!==null && o.price<=100){
      o.stake=round(T/o.price,2);
      var b=num(r.bsp); o.qual = isFinite(b) && b>=o.price;
      if(race.mode==='INTERIM'){ o.bet=true; } else { o.bet=o.qual; }
      if(race.mode==='FINAL' && o.qual){ outlay+=o.stake; nb++; if(r.won) { o.ret=o.stake*b; ret+=o.ret; } }
    }
    out.push(o);
  }
  var comm = ret>outlay ? S.settings.comm/100*(ret-outlay) : 0;
  var fin = race.mode==='FINAL';
  return {rows:out, outlay:fin?outlay:0, ret:fin?ret:0, comm:fin?comm:0, profit:fin?(ret-outlay-comm):0, nb:fin?nb:0, field:sum};
}
function allCalc(){ return S.races.map(function(r){ return r.runners.length?calc(r):{rows:[],outlay:0,ret:0,comm:0,profit:0,nb:0}; }); }

/* ============ helpers ============ */
function $(s,el){ return (el||document).querySelector(s); }
function h(tag,attrs,kids){ var e=document.createElement(tag); if(attrs) for(var k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='html') e.innerHTML=attrs[k]; else if(k.slice(0,2)==='on') e[k]=attrs[k]; else e.setAttribute(k,attrs[k]); } (kids||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); }); return e; }
function money(x,sign){ if(x==null||isNaN(x)) return '-'; var s=Math.abs(x).toFixed(2); return (x<0?'-':(sign&&x>0?'+':''))+'$'+s; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function cls(x){ return x>0?'pos':(x<0?'neg':''); }

/* ============ navigation ============ */
function renderNav(){

  chip('bets','Bets'); chip('set','Settings');

function go(v){ view=v; render(); window.scrollTo(0,0); }
function render(){

/* ============ summary ============ */
function viewSummary(m){
  var C=allCalc(), O=0,R=0,M=0,P=0; C.forEach(function(c){ O+=c.outlay;R+=c.ret;M+=c.comm;P+=c.profit; });
  var acc0=S.settings.account, live=acc0+P, roi=O>0?round(100*(R-O-M)/O,1):null, gf=acc0>0?round(live/acc0,4):null;
  m.appendChild(h('div',{class:'card big'},[
    h('div',{class:'l'},['Profit']),
    h('div',{class:'v '+cls(P)},[money(Math.round(P),true).replace('.00','')]),
    h('div',{class:'l'},['Account now '+money(live)+'  \u00b7  started '+money(acc0)])
  ]));
  var g=h('div',{class:'card'}); g.appendChild(h('h2',{},['Meeting totals']));
  var gr=h('div',{class:'grid'});
  [['Outlay',money(O)],['Return',money(R)],['Commission',money(M)],['ROI %',roi==null?'-':roi+'%'],['Growth factor',gf==null?'-':gf.toFixed(4)],['Min target (unit)',money(unit())]].forEach(function(p){
    gr.appendChild(h('div',{class:'st'},[h('div',{class:'v'},[p[1]]),h('div',{class:'l'},[p[0]])]));
  }); g.appendChild(gr); m.appendChild(g);

  var rc=h('div',{class:'card'}); rc.appendChild(h('h2',{},['Races']));
  var t=h('table'); t.innerHTML='<tr><th>Race</th><th>Bets</th><th>Outlay</th><th>Return</th><th>Profit</th></tr>';
  S.races.forEach(function(r,i){
    if(!r.runners.length) return; var c=C[i];
    var tr=h('tr',{class:'go'}); tr.onclick=function(){ go('r'+i); };
    tr.innerHTML='<td><b>R'+(i+1)+'</b> <span class="tag '+(r.mode==='FINAL'?'f':'')+'">'+r.mode.slice(0,3)+'</span></td><td>'+(r.mode==='FINAL'?c.nb:'-')+'</td><td>'+(r.mode==='FINAL'?c.outlay.toFixed(2):'-')+'</td><td>'+(r.mode==='FINAL'?c.ret.toFixed(2):'-')+'</td><td class="'+cls(c.profit)+'"><b>'+(r.mode==='FINAL'?c.profit.toFixed(2):'-')+'</b></td>';
    t.appendChild(tr);
  });
  if(t.rows.length<2) rc.appendChild(h('div',{class:'note'},['No races loaded yet. Open Settings to start a new meeting, or tap a race number and paste the field.'])); else rc.appendChild(t);
  m.appendChild(rc);

  var ip=h('div',{class:'card'}); ip.appendChild(h('h2',{},['Key inputs']));
  var row=h('div',{class:'row2'});
  row.appendChild(field('Market %',S.settings.market,function(v){ var x=num(v); if(x>0&&x<=200){ S.settings.market=x; save(); } },true));
  row.appendChild(field('Account at start $',S.settings.account,function(v){ var x=num(v); if(x>0){ S.settings.account=x; save(); } },true));
  ip.appendChild(row);
  ip.appendChild(h('div',{class:'note'},['Changing these re-prices every race. Tap Summary again to refresh the totals.']));
  m.appendChild(ip);

  bspPanel(m);
}

  var paste=h('div',{id:'paste',class:'hide',style:'margin-top:10px'});

    var lines=$('#pasteTa').value.split(/\n+/), rs=[];
    lines.forEach(function(l){ var mm=l.trim().match(/^[E]?(\d+)[\.\)\s\t-]+(.+)$/i); if(mm) rs.push({tab:parseInt(mm[1],10),name:mm[2].replace(/\s+\(?\d+(\.\d+)?kg.*$/i,'').trim().toUpperCase(),rating:'',bsp:'',won:false}); });

  }},['Load runners'])]));

  race.runners.forEach(function(r,i){
    var row=h('div',{class:'rn',id:'rn'+i});

    var nmI=h('input',{class:'nm',value:r.name}); nmI.oninput=function(){ r.name=nmI.value.toUpperCase(); save(); };
    var pr=h('div',{class:'pr',id:'pr'+i}); 
    var xb=h('button',{class:'x'},['\u00d7']); xb.onclick=function(){ if(confirm('Remove '+r.name+'?')){ race.runners.splice(i,1); save(); render(); } };
    row.appendChild(h('div',{class:'top'},[tabI,nmI,pr,xb]));
    var rI=h('input',{value:r.rating,inputmode:'decimal',placeholder:'rating / scr'}); rI.oninput=function(){ r.rating=rI.value; save(); upd(idx); };
    var bI=h('input',{value:r.bsp,inputmode:'decimal',placeholder:'BSP'}); bI.oninput=function(){ r.bsp=bI.value; save(); upd(idx); };

  $('#tot').classList.remove('hide'); upd(idx);

function upd(idx){
  var race=S.races[idx], c=calc(race);
  race.runners.forEach(function(r,i){
    var o=c.rows[i], row=$('#rn'+i); if(!row) return;
    var pr=$('#pr'+i), bt=$('#bt'+i);
    row.classList.toggle('scr',isScr(r)); 
    pr.innerHTML = o.price==null ? '' : (o.price>=1000?'<span style="color:var(--mute)">1000</span>':o.price.toFixed(1))+'<small>DAVO</small>';
    var txt='', has=false;
    if(o.price!=null && o.price<=100){
      if(race.mode==='INTERIM'){ has=true; txt='Bet '+money(o.stake)+' at min odds '+o.price.toFixed(1); }
      else if(isFinite(num(r.bsp))){
        if(o.qual){ has=true; txt='Bet '+money(o.stake)+' @ '+num(r.bsp)+(r.won?'  \u2192  returns '+money(o.ret):'  \u2192  lost'); }
        else txt='No bet: BSP '+num(r.bsp)+' below '+o.price.toFixed(1);
      } else txt='Waiting for BSP (stake would be '+money(o.stake)+')';
    }
    row.classList.toggle('hasbet',has); bt.textContent=txt;
  });
  var t=$('#tot');
  t.innerHTML='<div><div class="l">Outlay</div><div class="v">'+c.outlay.toFixed(2)+'</div></div><div><div class="l">Return</div><div class="v">'+c.ret.toFixed(2)+'</div></div><div><div class="l">Comm</div><div class="v">'+c.comm.toFixed(2)+'</div></div><div><div class="l">Profit</div><div class="v '+cls(c.profit)+'">'+c.profit.toFixed(2)+'</div></div>'+(race.mode==='INTERIM'?'<div><div class="l">Mode</div><div class="v">INTERIM</div></div>':'');
}

  return u;
}
function log(t,warn){ var l=$('#bspLog'); if(!l) return; l.innerHTML=''; var d=h('div',{class:warn?'warn':''},[t]); d.style.whiteSpace='pre-wrap'; l.appendChild(d); }
function fetchBSP(){
  var u=csvUrl(); if(!u){ log('Set the meeting date first (Settings).',true); return; }
  var target=S.settings.proxy ? S.settings.proxy.replace('{URL}',encodeURIComponent(u)) : u;
  log('Fetching '+u+' ...');
  fetch(target).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
   .then(function(t){ applyCSV(t); })
   .catch(function(e){ log('Could not download the file automatically ('+e.message+').\n\nMost likely the browser blocked it (the Betfair site does not allow other pages to read its files) or the file is not published yet.\n\nQuickest fix: tap \u201cOpen file in browser\u201d, select all, copy, come back and use \u201cPaste CSV text\u201d. Or save the file and use \u201cChoose CSV file\u201d.',true); });
}
function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){ var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=ch; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function norm(s){ return String(s).toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]/g,''); }
function applyCSV(text){
  var rows=parseCSV(text); if(rows.length<2){ log('No data found in that text.',true); return; }
  var hd=rows[0].map(function(x){return x.trim().toLowerCase();});
  var ix={ hint:hd.indexOf('menu_hint'), ev:hd.indexOf('event_name'), sel:hd.indexOf('selection_name'), wl:hd.indexOf('win_lose'), bsp:hd.indexOf('bsp') };
  if(ix.ev<0||ix.sel<0||ix.bsp<0){ log('This does not look like a Betfair BSP file (missing EVENT_NAME / SELECTION_NAME / BSP columns).',true); return; }
  var trk=norm(S.meeting.track), used=0, unmatched=[], races={}, wins={}, seenTrack=false;
  for(var i=1;i<rows.length;i++){
    var r=rows[i]; if(trk && ix.hint>=0 && norm(r[ix.hint]).indexOf(trk)<0) continue; seenTrack=true;
    var rm=String(r[ix.ev]).trim().match(/^R(\d+)\b/i); if(!rm) continue; var rn=parseInt(rm[1],10)-1; if(rn<0||rn>=NR) continue;
    var sm=String(r[ix.sel]).trim().match(/^(\d+)\.?\s*(.*)$/); var tab=sm?parseInt(sm[1],10):null, nm=sm?sm[2]:String(r[ix.sel]);
    var race=S.races[rn], hit=null, key=norm(nm);
    for(var k=0;k<race.runners.length;k++){ if(norm(race.runners[k].name)===key){ hit=race.runners[k]; break; } }
    if(!hit&&tab!=null) for(var k2=0;k2<race.runners.length;k2++){ if(race.runners[k2].tab===tab){ hit=race.runners[k2]; break; } }
    var b=parseFloat(r[ix.bsp]), won=ix.wl>=0 && String(r[ix.wl]).trim()==='1';
    if(!hit){ if(isFinite(b)&&b>0) unmatched.push('R'+(rn+1)+' '+tab+'. '+nm); continue; }
    races[rn]=(races[rn]||0)+1;
    if(isFinite(b)&&b>0){ hit.bsp=String(Math.round(b*100)/100); used++; }
    if(won){ race.runners.forEach(function(x){x.won=false;}); hit.won=true; wins[rn]=true; }
  }
  if(!seenTrack){ log('The file has no rows for \u201c'+S.meeting.track+'\u201d. Check the track name in Settings.',true); return; }
  var fin=[]; if(S.settings.autoFinal){ Object.keys(wins).forEach(function(k){ S.races[k].mode='FINAL'; fin.push(parseInt(k,10)+1); }); }
  save(); renderNav();
  var msg='Loaded '+used+' BSPs across '+Object.keys(races).length+' race(s). Winners found: '+(Object.keys(wins).map(function(k){return 'R'+(parseInt(k,10)+1);}).join(', ')||'none yet')+'.';
  if(fin.length) msg+='\nSwitched to FINAL: R'+fin.join(', R')+'.';
  if(unmatched.length) msg+='\nNot matched to a runner in your race tabs ('+unmatched.length+'): '+unmatched.slice(0,8).join('; ')+(unmatched.length>8?' ...':'');
  log(msg, unmatched.length>0);
  setTimeout(function(){ if(view==='sum'){ var m=$('#main'); var lg=$('#bspLog').textContent; render(); log(lg, unmatched.length>0); } },50);
}

/* ============ boot ============ */
if(!load()){ if(SAMPLE){ S.meeting={track:SAMPLE.track,date:SAMPLE.date}; S.races=JSON.parse(JSON.stringify(SAMPLE.races)); S.settings.account=2168.85; S.settings.market=80; } }
render();
</script>
