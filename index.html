<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Davo Ratings">
<meta name="theme-color" content="#0b3d2e">
<title>Davo Ratings</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#14201b;--mute:#66736d;--line:#dbe2de;--brand:#0b3d2e;--brand2:#14664c;--good:#0a7d3b;--bad:#c0262d;--bet:#e6f6ec;--warn:#fff4d6;--chip:#e3eae6}
@media (prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#17211c;--ink:#e8efeb;--mute:#93a39a;--line:#2a3830;--brand:#0b3d2e;--brand2:#1c8a65;--good:#4fd68a;--bad:#ff7b80;--bet:#12301f;--warn:#3a3114;--chip:#22302a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:env(safe-area-inset-top,0px) 0 0}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 2px}
.hd b{font-size:17px}.hd span{font-size:13px;opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 10px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:42px;height:38px;border:0;border-radius:19px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;padding:0 13px}
nav button.on{background:#fff;color:var(--brand)}
nav button.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7be3a7;margin-left:5px;vertical-align:middle}
nav button.fin::after{background:#ffd166}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.big{text-align:center;padding:18px 10px}
.big .v{font-size:40px;font-weight:700;letter-spacing:-.02em}
.big .l{font-size:13px;color:var(--mute)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.st .v{font-size:18px;font-weight:650}.st .l{font-size:11px;color:var(--mute);text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--mute);text-transform:uppercase;text-align:right;padding:4px 4px;font-weight:600}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr.go{cursor:pointer}
.tag{font-size:10px;padding:2px 6px;border-radius:8px;background:var(--chip);color:var(--mute);font-weight:700}
.tag.f{background:#ffe9a8;color:#6b5200}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:8px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--brand2);color:#fff;border-radius:11px;padding:11px 14px;font-weight:650;font-size:15px}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.red{background:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:9px;border-radius:9px;font-weight:700;font-size:14px}
.seg button.on{background:var(--brand2);color:#fff}
.rn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.rn.hasbet{background:var(--bet);border-color:var(--good)}
.rn.scr{opacity:.55}
.rn.scr .bspl,.rn.scr .won,.rn.scr .bet{display:none}
.rn.scr .ins{grid-template-columns:1fr 70px}
.rn .top{display:flex;align-items:center;gap:8px}
.rn .tab{width:30px;text-align:center;font-weight:800;font-size:16px;color:var(--mute);flex:0 0 30px;padding:4px 0;border:0;background:transparent}
.rn .nm{flex:1;font-weight:650;border:0;background:transparent;padding:4px 2px;font-size:15px;text-transform:uppercase;min-width:0}
.rn .pr{font-weight:800;font-size:19px;min-width:62px;text-align:right}
.rn .pr small{display:block;font-size:10px;color:var(--mute);font-weight:600}
.rn .x{border:0;background:transparent;color:var(--mute);font-size:20px;padding:0 4px}
.ins{display:grid;grid-template-columns:1fr 1fr 58px 66px;gap:8px;margin-top:6px;align-items:end}
.ins label{font-size:10px;color:var(--mute);text-transform:uppercase}
.ins input{padding:8px;font-size:17px;font-weight:600}
.won{height:41px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:800;color:var(--mute)}
.scrb{height:41px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:800;color:var(--mute);font-size:13px}
.scrb.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.won.on{background:var(--good);color:#fff;border-color:var(--good)}
.bet{font-size:13px;margin-top:6px;font-weight:600}
.tot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:15;font-variant-numeric:tabular-nums}
.tot div{text-align:center}.tot .l{font-size:10px;color:var(--mute);text-transform:uppercase}.tot .v{font-weight:750;font-size:16px}
.note{font-size:12px;color:var(--mute)}
.warn{background:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.log{font-size:13px;white-space:pre-wrap;margin-top:8px}
.bl{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bl:first-of-type{border-top:0}
.bl .s{font-weight:750}
.hide{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.ov .bx{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;max-width:420px;width:100%}
.ov .bx p{margin:0 0 12px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div class="hd"><b id="hTitle">Davo Ratings</b><span id="hSub"></span></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="tot hide" id="tot"></div>

<script>
/* ============ constants & state ============ */
var NR = 10, MAXRUN = 24, KEY = 'davo_ratings_v1';
var SAMPLE = null;

function blankRaces(){ var a=[]; for(var i=0;i<NR;i++) a.push({title:'',mode:'INTERIM',runners:[]}); return a; }
function defState(){
  return {meeting:{track:'',date:''},
    settings:{market:80,account:1000,div:30,sd:6,comm:8,
      csvUrl:'https://promo.betfair.com/betfairsp/prices/dwbfpricesauswin{DD}{MM}{YYYY}.csv',
      fileOffset:1,
      proxy:'',top:'ALL',ticks:true,minBet:1,autoFinal:true},
    races:blankRaces()};
}
var S = defState(), view = 'sum';

function load(){
  try{ var t=localStorage.getItem(KEY); if(t){ var o=JSON.parse(t); if(o&&o.races&&o.races.length===NR){ S=o; S.settings=Object.assign(defState().settings,S.settings); if(/dwbfpricesausthrwin/.test(S.settings.csvUrl)) S.settings.csvUrl=S.settings.csvUrl.replace('dwbfpricesausthrwin','dwbfpricesauswin'); return true; } } }catch(e){}
  return false;
}
var saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(function(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} },250); }

/* ============ maths (same model as the Excel macro) ============ */
function erfSmall(x){ var s=0,t=x,n=0; for(n=0;n<80;n++){ s+=t/(2*n+1); t=-t*x*x/(n+1); if(Math.abs(t)<1e-18) break; } return 2/Math.sqrt(Math.PI)*s; }
function erfc(x){ // x>=0
  if(x<3) return 1-erfSmall(x);
  var f=0; for(var k=60;k>=1;k--) f=(k/2)/(x+f);
  return Math.exp(-x*x)/Math.sqrt(Math.PI)/(x+f);
}
function Phi(z){ return z>=0 ? 1-0.5*erfc(z/Math.SQRT2) : 0.5*erfc(-z/Math.SQRT2); }
var SLICE=[]; (function(){ for(var i=0;i<17;i++){ var c=-4+0.5*i; SLICE.push([c,Phi(c+0.25)-Phi(c-0.25)]); } })();

function ratingVal(r){ var t=String(r.rating==null?'':r.rating).trim(); if(t===''||/^s/i.test(t)) return 0; var v=parseFloat(t); return isFinite(v)&&v>0?v:0; }
function isScr(r){ return /^s/i.test(String(r.rating||'').trim()); }
function num(x){ var v=parseFloat(String(x==null?'':x).trim()); return isFinite(v)?v:NaN; }
function round(x,d){ var m=Math.pow(10,d); return Math.round((x+1e-12)*m)/m; }
function unit(){ return round(S.settings.account/S.settings.div,2); }

var TICKS=[[1.01,2,0.01],[2,3,0.02],[3,4,0.05],[4,6,0.1],[6,10,0.2],[10,20,0.5],[20,30,1],[30,50,2],[50,100,5],[100,1000,10]];
function tickUp(p){ // lowest Betfair price on the ladder that is >= p
  if(p<=1.01) return 1.01; if(p>=1000) return 1000;
  for(var i=0;i<TICKS.length;i++){ var b=TICKS[i]; if(p<b[1]-1e-9||i===TICKS.length-1){
      var k=Math.ceil((p-b[0])/b[2]-1e-7), v=b[0]+k*b[2];
      return Math.round(v*100)/100; } }
  return p;
}
function fmtP(p){ return p<4?p.toFixed(2):(p<20?p.toFixed(1):p.toFixed(0)); }
function tickNear(p){
  var up=tickUp(p); if(up===p||p<=1.01||p>=1000) return up;
  var step=10; for(var i=0;i<TICKS.length;i++){ if(up>TICKS[i][0]+1e-9 && up<=TICKS[i][1]+1e-9){ step=TICKS[i][2]; break; } }
  var lo=Math.round((up-step)*100)/100;
  return (p-lo < up-p-1e-9) ? lo : up;
}
function calc(race){
  var n=race.runners.length, sd=S.settings.sd, mk=S.settings.market/100, T=unit();
  var m=[]; for(var i=0;i<MAXRUN;i++) m.push(i<n?ratingVal(race.runners[i]):0);
  var P=[]; for(var t=0;t<MAXRUN;t++){
    var tot=0;
    for(var k=0;k<SLICE.length;k++){
      var c=SLICE[k][0], w=SLICE[k][1], prod=1, self=1;
      for(var a=0;a<MAXRUN;a++){ var p=Phi((c*sd+m[t]-m[a])/sd); if(a===t) self=p; prod*=p; }
      tot+=w*prod/self;
    }
    P.push(tot);
  }
  var sum=0; for(var j=0;j<MAXRUN;j++) sum+=P[j];
  var out=[], outlay=0, ret=0, nb=0;
  for(var q=0;q<n;q++){
    var r=race.runners[q], o={p:P[q]/sum,price:null,stake:0,ret:0,qual:false};
    if(m[q]>0){ o.price = P[q]<0.002 ? 1000 : round(sum/(mk*P[q]),1); if(S.settings.ticks!==false && o.price<1000) o.price=tickNear(o.price); }
    if(o.price!==null && o.price<=100){
      o.stake=round(T/o.price,2);
      var mb=S.settings.minBet>0?S.settings.minBet:0;
      if(mb && o.stake<mb){ if(o.stake>=mb/2-1e-9) o.stake=mb; else { o.stake=0; o.skip=true; } }
      var b=num(r.bsp); o.qual = !o.skip && isFinite(b) && b>=o.price;
      if(race.mode==='INTERIM'){ o.bet=!o.skip; } else { o.bet=o.qual; }
      if(race.mode==='FINAL' && o.qual){ outlay+=o.stake; nb++; if(r.won) { o.ret=o.stake*b; ret+=o.ret; } }
    }
    out.push(o);
  }
  var comm = ret>outlay ? S.settings.comm/100*(ret-outlay) : 0;
  var fin = race.mode==='FINAL';
  return {rows:out, outlay:fin?outlay:0, ret:fin?ret:0, comm:fin?comm:0, profit:fin?(ret-outlay-comm):0, nb:fin?nb:0, field:sum};
}
function allCalc(){ return S.races.map(function(r){ return r.runners.length?calc(r):{rows:[],outlay:0,ret:0,comm:0,profit:0,nb:0}; }); }

var showAll=false;
function topN(){ var t=S.settings.top; return (t==='ALL'||!(t>=1))?0:parseInt(t,10); }
function visSet(race,c){
  var N=topN(); if(!N||showAll) return null;
  var idx=[]; c.rows.forEach(function(o,i){ if(o.price!=null) idx.push(i); });
  idx.sort(function(a,b){ return c.rows[b].p-c.rows[a].p; });
  var set={}; idx.slice(0,N).forEach(function(i){ set[i]=true; });
  return {set:set,priced:idx.length,N:N};
}
/* ============ helpers ============ */
function $(s,el){ return (el||document).querySelector(s); }
function h(tag,attrs,kids){ var e=document.createElement(tag); if(attrs) for(var k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='html') e.innerHTML=attrs[k]; else if(k.slice(0,2)==='on') e[k]=attrs[k]; else e.setAttribute(k,attrs[k]); } (kids||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); }); return e; }
function money(x,sign){ if(x==null||isNaN(x)) return '-'; var s=Math.abs(x).toFixed(2); return (x<0?'-':(sign&&x>0?'+':''))+'$'+s; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function cls(x){ return x>0?'pos':(x<0?'neg':''); }

/* in-page dialogs (browser pop-ups are blocked in some viewers) */
function ask(msg,yes,opts){
  var ov=h('div',{class:'ov'}), bx=h('div',{class:'bx'}); ov.appendChild(bx); bx.appendChild(h('p',{},[msg]));
  var inp=null; if(opts&&opts.input){ inp=h('input',{type:'text'}); bx.appendChild(inp); }
  var bt=h('div',{class:'btns'}); 
  var no=h('button',{class:'btn alt'},[opts&&opts.say?'OK':'Cancel']); no.onclick=function(){ document.body.removeChild(ov); };
  if(!(opts&&opts.say)){ var ok=h('button',{class:'btn'},['OK']); ok.onclick=function(){ var v=inp?inp.value:true; document.body.removeChild(ov); yes(v); }; bt.appendChild(ok); }
  bt.appendChild(no); bx.appendChild(bt); document.body.appendChild(ov); if(inp) inp.focus();
}
function say(msg){ ask(msg,null,{say:true}); }
/* ============ navigation ============ */
function renderNav(){
  var nav=$('#nav'); nav.innerHTML='';
  function chip(id,label,extra){ var b=h('button',{class:(view===id?'on ':'')+(extra||'')},[label]); b.onclick=function(){ go(id); }; nav.appendChild(b); return b; }
  chip('sum','Summary');
  for(var i=0;i<NR;i++){ var r=S.races[i]; var ex=r.runners.length?(r.mode==='FINAL'?'dot fin':'dot'):''; chip('r'+i,String(i+1),ex); }
  chip('bets','Bets'); chip('set','Settings');
  var on=$('#nav .on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
  $('#hTitle').textContent = (S.meeting.track||'Davo Ratings');
  $('#hSub').textContent = S.meeting.date||'';
}
function go(v){ if(v!==view) showAll=false; view=v; render(); window.scrollTo(0,0); }
function render(){
  renderNav();
  var m=$('#main'); m.innerHTML=''; $('#tot').classList.add('hide');
  if(view==='sum') viewSummary(m); else if(view==='bets') viewBets(m); else if(view==='set') viewSettings(m); else viewRace(m,parseInt(view.slice(1),10));
}

/* ============ summary ============ */
function viewSummary(m){
  var C=allCalc(), O=0,R=0,M=0,P=0; C.forEach(function(c){ O+=c.outlay;R+=c.ret;M+=c.comm;P+=c.profit; });
  var acc0=S.settings.account, live=acc0+P, roi=O>0?round(100*(R-O-M)/O,1):null, gf=acc0>0?round(live/acc0,4):null;
  m.appendChild(h('div',{class:'card big'},[
    h('div',{class:'l'},['Profit']),
    h('div',{class:'v '+cls(P)},[money(Math.round(P),true).replace('.00','')]),
    h('div',{class:'l'},['Account now '+money(live)+'  \u00b7  started '+money(acc0)])
  ]));
  var g=h('div',{class:'card'}); g.appendChild(h('h2',{},['Meeting totals']));
  var gr=h('div',{class:'grid'});
  [['Outlay',money(O)],['Return',money(R)],['Commission',money(M)],['ROI %',roi==null?'-':roi+'%'],['Growth factor',gf==null?'-':gf.toFixed(4)],['Min target (unit)',money(unit())]].forEach(function(p){
    gr.appendChild(h('div',{class:'st'},[h('div',{class:'v'},[p[1]]),h('div',{class:'l'},[p[0]])]));
  }); g.appendChild(gr); m.appendChild(g);

  var rc=h('div',{class:'card'}); rc.appendChild(h('h2',{},['Races']));
  var t=h('table'); t.innerHTML='<tr><th>Race</th><th>Bets</th><th>Outlay</th><th>Return</th><th>Profit</th></tr>';
  S.races.forEach(function(r,i){
    if(!r.runners.length) return; var c=C[i];
    var tr=h('tr',{class:'go'}); tr.onclick=function(){ go('r'+i); };
    tr.innerHTML='<td><b>R'+(i+1)+'</b> <span class="tag '+(r.mode==='FINAL'?'f':'')+'">'+r.mode.slice(0,3)+'</span></td><td>'+(r.mode==='FINAL'?c.nb:'-')+'</td><td>'+(r.mode==='FINAL'?c.outlay.toFixed(2):'-')+'</td><td>'+(r.mode==='FINAL'?c.ret.toFixed(2):'-')+'</td><td class="'+cls(c.profit)+'"><b>'+(r.mode==='FINAL'?c.profit.toFixed(2):'-')+'</b></td>';
    t.appendChild(tr);
  });
  if(t.rows.length<2) rc.appendChild(h('div',{class:'note'},['No races loaded yet. Open Settings to start a new meeting, or tap a race number and paste the field.'])); else rc.appendChild(t);
  m.appendChild(rc);

  var ip=h('div',{class:'card'}); ip.appendChild(h('h2',{},['Key inputs']));
  var row=h('div',{class:'row2'});
  row.appendChild(field('Market %',S.settings.market,function(v){ var x=num(v); if(x>0&&x<=200){ S.settings.market=x; save(); } },true));
  row.appendChild(field('Account at start $',S.settings.account,function(v){ var x=num(v); if(x>0){ S.settings.account=x; save(); } },true));
  ip.appendChild(row);
  ip.appendChild(h('div',{class:'note'},['Changing these re-prices every race. Tap Summary again to refresh the totals.']));
  m.appendChild(ip);

  bspPanel(m);
}
function field(label,val,onchg,dec){
  var i=h('input',{value:val,inputmode:dec?'decimal':'text'}); i.oninput=function(){ onchg(i.value); };
  var l=h('label',{class:'f'},[label]); l.appendChild(i); return l;
}

/* ============ race view ============ */
function viewRace(m,idx){
  var race=S.races[idx];
  var top=h('div',{class:'card'});
  var ti=h('input',{value:race.title,placeholder:'Race '+(idx+1)+' name / time / distance'}); ti.oninput=function(){ race.title=ti.value; save(); };
  top.appendChild(ti);
  var seg=h('div',{class:'seg',style:'margin-top:8px'});
  ['INTERIM','FINAL'].forEach(function(mode){
    var b=h('button',{class:race.mode===mode?'on':''},[mode]); b.onclick=function(){ race.mode=mode; save(); render(); }; seg.appendChild(b);
  });
  top.appendChild(seg);
  top.appendChild(h('div',{class:'note',style:'margin-top:6px'},['INTERIM shows stakes for every runner priced under $100. FINAL only counts bets where the BSP is at or above your price, and adds them to the totals.']));
  var bt=h('div',{class:'btns'});
  bt.appendChild(h('button',{class:'btn alt',onclick:function(){ ask('Runner name (tab number is next free)',function(t){ if(typeof t==='string'&&t.trim()){ if(race.runners.length>=MAXRUN){say('Max 24 runners');return;} var n=race.runners.reduce(function(a,r){return Math.max(a,r.tab);},0)+1; race.runners.push({tab:n,name:t.trim().toUpperCase(),rating:'',bsp:'',won:false}); save(); render(); } },{input:true}); }},['+ Runner']));
  bt.appendChild(h('button',{class:'btn alt',onclick:function(){ var p=$('#paste'); p.classList.toggle('hide'); }},['Paste field']));
  bt.appendChild(h('button',{class:'btn alt',onclick:function(){ ask('Clear BSPs and winner for race '+(idx+1)+'?',function(){ race.runners.forEach(function(r){r.bsp='';r.won=false;}); save(); render(); }); }},['Clear BSP/result']));
  bt.appendChild(h('button',{class:'btn alt',onclick:function(){ ask('Remove ALL runners from race '+(idx+1)+'?',function(){ race.runners=[]; race.mode='INTERIM'; save(); render(); }); }},['Clear race']));
  top.appendChild(bt);
  var paste=h('div',{id:'paste',class:'hide',style:'margin-top:10px'});
  paste.appendChild(h('textarea',{id:'pasteTa',placeholder:'One runner per line, e.g.\n1 Horse One\n2. Horse Two\n3\tHorse Three\n(replaces current runners; ratings can be added after)'}));
  paste.appendChild(h('div',{class:'btns'},[h('button',{class:'btn',onclick:function(){
    var lines=$('#pasteTa').value.split(/\n+/), rs=[];
    lines.forEach(function(l){ var mm=l.trim().match(/^[E]?(\d+)[\.\)\s\t-]+(.+)$/i); if(mm) rs.push({tab:parseInt(mm[1],10),name:mm[2].replace(/\s+\(?\d+(\.\d+)?kg.*$/i,'').trim().toUpperCase(),rating:'',bsp:'',won:false}); });
    if(!rs.length){ say('No lines recognised. Use: number then name.'); return; }
    race.runners=rs.slice(0,MAXRUN); save(); render();
  }},['Load runners'])]));
  top.appendChild(paste);
  m.appendChild(top);

  if(!race.runners.length){ m.appendChild(h('div',{class:'card note'},['No runners yet. Use Paste field or + Runner.'])); return; }

  var vs=visSet(race,calc(race)), hidden=0;
  if(vs&&vs.priced>vs.N){
    var nb=h('div',{class:'card note'},['Showing the top '+vs.N+' of '+vs.priced+' rated runners (change in Settings). ']);
    var sb=h('button',{class:'btn alt',style:'margin-left:6px;padding:6px 10px;font-size:13px'},['Show all']); sb.onclick=function(){ showAll=true; render(); }; nb.appendChild(sb); m.appendChild(nb);
  } else if(showAll&&topN()){
    var nb2=h('div',{class:'card note'},['Showing all runners. ']);
    var sb2=h('button',{class:'btn alt',style:'margin-left:6px;padding:6px 10px;font-size:13px'},['Show top '+topN()]); sb2.onclick=function(){ showAll=false; render(); }; nb2.appendChild(sb2); m.appendChild(nb2);
  }
  race.runners.forEach(function(r,i){
    if(vs){ var cr=calc(race).rows[i]; var show = vs.set[i] || (cr.price==null && !isScr(r)); if(!show){ hidden++; return; } }
    var row=h('div',{class:'rn',id:'rn'+i});
    var tabI=h('input',{class:'tab',value:r.tab,inputmode:'numeric'}); tabI.oninput=function(){ var v=parseInt(tabI.value,10); if(v>0) r.tab=v; save(); };
    var nmI=h('input',{class:'nm',value:r.name}); nmI.oninput=function(){ r.name=nmI.value.toUpperCase(); save(); };
    var pr=h('div',{class:'pr',id:'pr'+i}); 
    var xb=h('button',{class:'x'},['\u00d7']); xb.onclick=function(){ ask('Remove '+r.name+'?',function(){ race.runners.splice(i,1); save(); render(); }); };
    row.appendChild(h('div',{class:'top'},[tabI,nmI,pr,xb]));
    var rI=h('input',{value:r.rating,inputmode:'decimal',placeholder:'rating / scr'}); rI.oninput=function(){ r.rating=rI.value; save(); upd(idx); };
    var bI=h('input',{value:r.bsp,inputmode:'decimal',placeholder:'BSP'}); bI.oninput=function(){ r.bsp=bI.value; save(); upd(idx); };
    var wb=h('button',{class:'won'+(r.won?' on':'')},['WON']); wb._r=r; wb.onclick=function(){ var was=r.won; race.runners.forEach(function(x){x.won=false;}); r.won=!was; save(); $('#main').querySelectorAll('.won').forEach(function(b){ b.className='won'+(b._r.won?' on':''); }); upd(idx); };
    var sb=h('button',{class:'scrb'+(isScr(r)?' on':'')},['SCR']);
    sb.onclick=function(){ if(isScr(r)){ r.rating=r.prev||''; } else { r.prev=r.rating; r.rating='scr'; if(r.won) r.won=false; } rI.value=r.rating; sb.className='scrb'+(isScr(r)?' on':''); save(); upd(idx); };
    rI.addEventListener('input',function(){ sb.className='scrb'+(isScr(r)?' on':''); });
    var l1=h('label',{},['Rating']); l1.appendChild(rI); var l2=h('label',{class:'bspl'},['Betfair SP']); l2.appendChild(bI);
    row.appendChild(h('div',{class:'ins'},[l1,l2,sb,wb]));
    row.appendChild(h('div',{class:'bet',id:'bt'+i}));
    m.appendChild(row);
  });
  m.appendChild(h('div',{class:'note'},['Ratings: type a number, or tap SCR for a scratching (tap again to undo). Runners with no rating are left out of the price (as in the spreadsheet).']));
  $('#tot').classList.remove('hide'); upd(idx);
}
function upd(idx){
  var race=S.races[idx], c=calc(race);
  race.runners.forEach(function(r,i){
    var o=c.rows[i], row=$('#rn'+i); if(!row) return;
    var pr=$('#pr'+i), bt=$('#bt'+i);
    row.classList.toggle('scr',isScr(r)); 
    pr.innerHTML = o.price==null ? '' : (o.price>=1000?'<span style="color:var(--mute)">1000</span>':fmtP(o.price))+'<small>DAVO</small>';
    var txt='', has=false;
    if(o.price!=null && o.price<=100){
      if(o.skip){ txt='No bet: stake under '+money(S.settings.minBet/2); }
      else if(race.mode==='INTERIM'){ has=true; txt='Bet '+money(o.stake)+' at min odds '+fmtP(o.price); }
      else if(isFinite(num(r.bsp))){
        if(o.qual){ has=true; txt='Bet '+money(o.stake)+' @ '+num(r.bsp)+(r.won?'  \u2192  returns '+money(o.ret):'  \u2192  lost'); }
        else txt='No bet: BSP '+num(r.bsp)+' below '+fmtP(o.price);
      } else txt='Waiting for BSP (stake would be '+money(o.stake)+')';
    }
    row.classList.toggle('hasbet',has); bt.textContent=txt;
  });
  var t=$('#tot');
  t.innerHTML='<div><div class="l">Outlay</div><div class="v">'+c.outlay.toFixed(2)+'</div></div><div><div class="l">Return</div><div class="v">'+c.ret.toFixed(2)+'</div></div><div><div class="l">Comm</div><div class="v">'+c.comm.toFixed(2)+'</div></div><div><div class="l">Profit</div><div class="v '+cls(c.profit)+'">'+c.profit.toFixed(2)+'</div></div>'+(race.mode==='INTERIM'?'<div><div class="l">Mode</div><div class="v">INTERIM</div></div>':'');
}

/* ============ bets tab ============ */
function viewBets(m){
  var T=unit();
  m.appendChild(h('div',{class:'card'},[h('div',{class:'note'},['Planned back bets at Betfair SP, stake = '+money(T)+' / Davo price. Set each as a Limit On Close bet with the minimum odds shown. Runners priced over $100 are skipped.'])]));
  var any=false;
  S.races.forEach(function(r,i){
    if(!r.runners.length) return; var c=calc(r), rows=[];
    r.runners.forEach(function(x,k){ var o=c.rows[k]; if(o.price!=null&&o.price<=100&&!o.skip) rows.push({x:x,o:o}); });
    if(!rows.length) return; any=true;
    rows.sort(function(a,b){return a.o.price-b.o.price;});
    var hid=0, NN=topN(); if(NN&&rows.length>NN){ hid=rows.length-NN; rows=rows.slice(0,NN); }
    var card=h('div',{class:'card'}); card.appendChild(h('h2',{},['Race '+(i+1)+(r.title?'  \u00b7  '+r.title:'')]));
    card.onclick=function(){ go('r'+i); };
    rows.forEach(function(p){
      var st=''; if(r.mode==='FINAL'&&isFinite(num(p.x.bsp))) st=p.o.qual?'  \u2713':'  \u2717';
      card.appendChild(h('div',{class:'bl'},[h('span',{},[p.x.tab+'. '+p.x.name]),h('span',{},['min '+fmtP(p.o.price)+'  \u00b7  ']),h('span',{class:'s'},[money(p.o.stake)+st])]));
    });
    if(hid) card.appendChild(h('div',{class:'note',style:'margin-top:6px'},['+ '+hid+' more bet(s) not shown (Main chances setting)']));
    m.appendChild(card);
  });
  if(!any) m.appendChild(h('div',{class:'card note'},['Enter ratings in the race tabs and bets will list here.']));
}

  a.appendChild(field('Minimum bet $ (stakes from half this are raised to it; lower ones skipped)',S.settings.minBet,function(v){ var x=num(v); if(x>=0){S.settings.minBet=x;save();} },true));
  p.appendChild(a);
  var tk=h('label',{class:'f',style:'margin-top:4px'}); var tc=h('input',{type:'checkbox',style:'width:auto;margin-right:8px'}); tc.checked=S.settings.ticks!==false; tc.onchange=function(){ S.settings.ticks=tc.checked; save(); };
  tk.appendChild(tc); tk.appendChild(document.createTextNode('Round Davo prices to the nearest Betfair price step (stake is worked out from the rounded price)')); p.appendChild(tk);
  p.appendChild(h('div',{class:'note'},['Unit (MIN TARGET) = account \u00f7 '+'divisor. Stake = unit \u00f7 Davo price.']));
  m.appendChild(p);

  var b=h('div',{class:'card'}); b.appendChild(h('h2',{},['Betfair SP download']));
  b.appendChild(field('File date offset (days after the meeting date; Betfair dates its files by UK time)',S.settings.fileOffset,function(v){ var x=parseInt(v,10); if(isFinite(x)&&x>=-3&&x<=3){ S.settings.fileOffset=x; save(); } },true));
  b.appendChild(field('CSV address ({DD} {MM} {YYYY} are filled from the meeting date plus the offset)',S.settings.csvUrl,function(v){ S.settings.csvUrl=v.trim(); save(); }));
  b.appendChild(field('Proxy template (optional, use {URL}), only needed if the browser blocks the download',S.settings.proxy,function(v){ S.settings.proxy=v.trim(); save(); }));
  var cb=h('label',{class:'f'}); var ck=h('input',{type:'checkbox',style:'width:auto;margin-right:8px'}); ck.checked=!!S.settings.autoFinal; ck.onchange=function(){ S.settings.autoFinal=ck.checked; save(); };
  cb.appendChild(ck); cb.appendChild(document.createTextNode('Switch a race to FINAL once its winner is loaded')); b.appendChild(cb);
  m.appendChild(b);

  var d=h('div',{class:'card'}); d.appendChild(h('h2',{},['Backup']));
  var ta=h('textarea',{id:'bk',placeholder:'Tap Export, copy the text somewhere safe (Notes). To restore, paste it here and tap Import.'});
  d.appendChild(ta);
  d.appendChild(h('div',{class:'btns'},[
    h('button',{class:'btn alt',onclick:function(){ ta.value=JSON.stringify(S); ta.select(); try{ document.execCommand('copy'); }catch(e){} }},['Export all (copies)']),
    h('button',{class:'btn alt',onclick:function(){ var o={type:'ratings',meeting:S.meeting,races:S.races.map(function(r){ return {title:r.title,runners:r.runners.map(function(x){ return {tab:x.tab,name:x.name,rating:x.rating}; })}; })}; ta.value=JSON.stringify(o); ta.select(); try{ document.execCommand('copy'); }catch(e){} }},['Export ratings only']),
    h('button',{class:'btn alt',onclick:function(){ try{ var o=JSON.parse(ta.value); if(!o.races||o.races.length!==NR) throw 0;
      if(o.type==='ratings'){ ask('Load these ratings? This replaces the meeting and all races here. Your account and settings are kept.',function(){ S.meeting=o.meeting||{track:'',date:''}; S.races=o.races.map(function(r){ return {title:r.title||'',mode:'INTERIM',runners:(r.runners||[]).slice(0,MAXRUN).map(function(x){ return {tab:x.tab,name:x.name,rating:x.rating==null?'':String(x.rating),bsp:'',won:false}; })}; }); save(); go('sum'); }); return; }
      S=o; S.settings=Object.assign(defState().settings,S.settings); save(); go('sum'); }catch(e){ say('That text is not a valid backup.'); } }},['Import']),
    h('button',{class:'btn red',onclick:function(){ ask('Erase everything stored in this app?',function(){ S=defState(); try{localStorage.removeItem(KEY);}catch(e){} go('set'); }); }},['Erase all'])
  ]));

/* ============ Betfair SP loading ============ */
function bspPanel(m){
  var c=h('div',{class:'card'}); c.appendChild(h('h2',{},['Betfair SP results']));
  c.appendChild(h('div',{class:'note'},['Loads each runner\u2019s BSP and the winner from Betfair\u2019s published starting price file for the meeting date.']));
  var bt=h('div',{class:'btns'});
  var lk=h('a',{href:csvUrl()||'#',target:'_blank',rel:'noopener',class:'btn',style:'text-decoration:none;display:inline-block'},['Fetch BSPs']);
  lk.onclick=function(e){ var u=csvUrl(); if(!u){ e.preventDefault(); log('Set the meeting date first (Settings).',true); return; } lk.href=u; log('Opened Betfair\u2019s file for '+u.split('/').pop()+'. Select all, copy, come back and use Paste CSV text.'); };
  bt.appendChild(lk);
  bt.appendChild(h('button',{class:'btn alt',onclick:function(){ $('#bspPaste').classList.toggle('hide'); }},['Paste CSV text']));
  var fi=h('input',{type:'file',accept:'.csv,text/csv,text/plain',class:'hide',id:'bspFile'}); fi.onchange=function(){ var f=fi.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ applyCSV(String(rd.result)); }; rd.readAsText(f); };
  bt.appendChild(h('button',{class:'btn alt',onclick:function(){ fi.click(); }},['Choose CSV file'])); bt.appendChild(fi);
  c.appendChild(bt);
  var pz=h('div',{id:'bspPaste',class:'hide',style:'margin-top:10px'});
  pz.appendChild(h('textarea',{id:'bspTa',placeholder:'Paste the contents of the Betfair CSV here'}));
  pz.appendChild(h('div',{class:'btns'},[h('button',{class:'btn',onclick:function(){ applyCSV($('#bspTa').value); }},['Apply'])]));
  c.appendChild(pz);
  c.appendChild(h('div',{class:'log',id:'bspLog'}));
  m.appendChild(c);
}
function csvUrl(){
  var d=S.meeting.date; if(!/^\d{4}-\d\d-\d\d$/.test(d)) return '';
  var off=parseInt(S.settings.fileOffset,10); if(!isFinite(off)) off=0;
  var dt=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)+off));
  var yy=String(dt.getUTCFullYear()), mm=('0'+(dt.getUTCMonth()+1)).slice(-2), dd=('0'+dt.getUTCDate()).slice(-2);
  return S.settings.csvUrl.replace('{YYYY}',yy).replace('{MM}',mm).replace('{DD}',dd);
}
function log(t,warn){ var l=$('#bspLog'); if(!l) return; l.innerHTML=''; var d=h('div',{class:warn?'warn':''},[t]); d.style.whiteSpace='pre-wrap'; l.appendChild(d); }
function fetchBSP(){
  var u=csvUrl(); if(!u){ log('Set the meeting date first (Settings).',true); return; }
  var target=S.settings.proxy ? S.settings.proxy.replace('{URL}',encodeURIComponent(u)) : u;
  log('Fetching '+u+' ...');
  fetch(target).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
   .then(function(t){ applyCSV(t); })
   .catch(function(e){ log('Could not download the file automatically ('+e.message+').\n\nMost likely the browser blocked it (the Betfair site does not allow other pages to read its files) or the file is not published yet.\n\nQuickest fix: tap \u201cOpen file in browser\u201d, select all, copy, come back and use \u201cPaste CSV text\u201d. Or save the file and use \u201cChoose CSV file\u201d.',true); });
}
function parseCSV(t){
  t=String(t).replace(/^\ufeff/,'');
  var first=t.split(/\r?\n/).filter(function(l){return l.trim()!=='';})[0]||'';
  var cm=(first.match(/,/g)||[]).length, tb=(first.match(/\t/g)||[]).length, sc=(first.match(/;/g)||[]).length;
  var D=(tb>cm&&tb>=sc)?'\t':((sc>cm)?';':',');
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){ var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===D){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=ch; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function norm(s){ return String(s).toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]/g,''); }
function applyCSV(text){
  var rows=parseCSV(text); if(rows.length<2){ log('No data found in that text.',true); return; }
  function lc(r){ return r.map(function(x){return String(x).trim().toLowerCase().replace(/[^a-z0-9_]/g,'_');}); }
  function find(hd,names){ for(var k=0;k<names.length;k++){ var p=hd.indexOf(names[k]); if(p>=0) return p; } return -1; }
  var hi=-1, ix=null;
  for(var q=0;q<Math.min(rows.length,40);q++){
    var hd=lc(rows[q]); var c={ hint:find(hd,['menu_hint','track','venue','meeting']), ev:find(hd,['event_name','market_name','race','event']), sel:find(hd,['selection_name','runner_name','selection','runner','horse']), wl:find(hd,['win_lose','result','win_loss','outcome']), bsp:find(hd,['bsp','betfair_sp','betfair_starting_price','sp']) };
    if(c.ev>=0&&c.sel>=0&&c.bsp>=0){ hi=q; ix=c; break; }
  }
  if(hi<0){ var seen=rows[0].slice(0,12).join(' | ').slice(0,300); log('This does not look like a Betfair BSP file: I could not find EVENT_NAME / SELECTION_NAME / BSP columns.\n\nFirst line I saw ('+rows[0].length+' columns):\n'+seen,true); return; }
  rows=rows.slice(hi);
  var trk=norm(S.meeting.track), used=0, unmatched=[], races={}, wins={}, seenTrack=false;
  for(var i=1;i<rows.length;i++){
    var r=rows[i]; if(trk && ix.hint>=0 && norm(r[ix.hint]).indexOf(trk)<0) continue; seenTrack=true;
    var rm=String(r[ix.ev]).trim().match(/^R(\d+)\b/i); if(!rm) continue; var rn=parseInt(rm[1],10)-1; if(rn<0||rn>=NR) continue;
    var sm=String(r[ix.sel]).trim().match(/^(\d+)\.?\s*(.*)$/); var tab=sm?parseInt(sm[1],10):null, nm=sm?sm[2]:String(r[ix.sel]);
    var race=S.races[rn], hit=null, key=norm(nm);
    for(var k=0;k<race.runners.length;k++){ if(norm(race.runners[k].name)===key){ hit=race.runners[k]; break; } }
    if(!hit&&tab!=null) for(var k2=0;k2<race.runners.length;k2++){ if(race.runners[k2].tab===tab){ hit=race.runners[k2]; break; } }
    var b=parseFloat(r[ix.bsp]), won=ix.wl>=0 && /^(1|win|winner|won)$/i.test(String(r[ix.wl]).trim());
    if(!hit){ if(isFinite(b)&&b>0) unmatched.push('R'+(rn+1)+' '+tab+'. '+nm); continue; }
    if(isScr(hit)) continue;
    races[rn]=(races[rn]||0)+1;
    if(isFinite(b)&&b>0){ hit.bsp=String(Math.round(b*100)/100); used++; }
    if(won){ race.runners.forEach(function(x){x.won=false;}); hit.won=true; wins[rn]=true; }
  }
  if(!seenTrack){ log('The file has no rows for \u201c'+S.meeting.track+'\u201d. Check the track name in Settings.',true); return; }
  var fin=[]; if(S.settings.autoFinal){ Object.keys(wins).forEach(function(k){ S.races[k].mode='FINAL'; fin.push(parseInt(k,10)+1); }); }
  save(); renderNav();
  var msg='Loaded '+used+' BSPs across '+Object.keys(races).length+' race(s). Winners found: '+(Object.keys(wins).map(function(k){return 'R'+(parseInt(k,10)+1);}).join(', ')||'none yet')+'.';
  if(fin.length) msg+='\nSwitched to FINAL: R'+fin.join(', R')+'.';
  if(unmatched.length) msg+='\nNot matched to a runner in your race tabs ('+unmatched.length+'): '+unmatched.slice(0,8).join('; ')+(unmatched.length>8?' ...':'');
  log(msg, unmatched.length>0);
  setTimeout(function(){ if(view==='sum'){ var m=$('#main'); var lg=$('#bspLog').textContent; render(); log(lg, unmatched.length>0); } },50);
}

/* ============ boot ============ */
if(!load()){ if(SAMPLE){ S.meeting={track:SAMPLE.track,date:SAMPLE.date}; S.races=JSON.parse(JSON.stringify(SAMPLE.races)); S.settings.market=80; } }
render();
</script>
